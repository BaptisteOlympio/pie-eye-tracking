[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "grpcio>=1.85.3",
    "grpcio-tools>=1.85.3",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "pyzmq>=27.3.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
